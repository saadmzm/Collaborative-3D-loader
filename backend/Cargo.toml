[package]
name = "backend"
version = "0.1.0"
edition = "2024"
authors = ["Saad Moazzam"]
default-run = "backend"

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.31"
notify = "8.2.0"
rusqlite = {version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = "0.28.0"
walkdir = "2.5.0"