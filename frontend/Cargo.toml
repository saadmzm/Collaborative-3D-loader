[package]
name = "frontend"
version = "0.1.0"
edition = "2024"
authors = ["Saad Moazzam"]
rust-version = "1.86.0"

[dependencies]
base64 = "0.22.1"
bevy = { version = "0.15.3", features = ["jpeg"] }
bevy_egui = "0.33.0"
bevy_panorbit_camera = "0.25.0"
futures-util = "0.3.31"
rfd = "0.16.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt", "net", "sync", "macros", "time"] }
tokio-tungstenite = "0.28.0"
uuid = { version = "1.12.1", features = ["v4"] }